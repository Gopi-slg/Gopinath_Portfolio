<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gopinath Senthilkumar — Java Developer</title>
<meta name="description" content="Portfolio of Gopinath Senthilkumar: Java, Spring Boot, REST APIs, MySQL, MongoDB, GCP. Trained 900+ students. Based in Erode, Tamil Nadu.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Sans:wght@400;500&family=Noto+Sans+Tamil:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f141c;--bg2:#151d28;--ink:#e4efe8;--mute:#8ea79a;--line:#1e3029;--cu:#2bd058;--cu2:#7be79a;
--hd:'Bricolage Grotesque','Noto Sans Tamil','Segoe UI',system-ui,sans-serif;--bd:'IBM Plex Sans','Noto Sans Tamil','Segoe UI',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef4ef;--bg2:#e0ebe3;--ink:#0f1c14;--mute:#44594c;--line:#bfd3c5;--cu:#0b7a3a;--cu2:#0a6a32;color-scheme:light}}
:root[data-theme="light"]{--bg:#eef4ef;--bg2:#e0ebe3;--ink:#0f1c14;--mute:#44594c;--line:#bfd3c5;--cu:#0b7a3a;--cu2:#0a6a32;color-scheme:light}
:root[data-theme="dark"]{--bg:#0f141c;--bg2:#151d28;--ink:#e4efe8;--mute:#8ea79a;--line:#1e3029;--cu:#2bd058;--cu2:#7be79a;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
html[lang="en"]{font-size:112.5%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 var(--bd);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
a{color:inherit}
:focus-visible{outline:2px solid var(--cu);outline-offset:3px}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 clamp(20px,5vw,40px)}
h1,h2,h3{font-family:var(--hd);margin:0;line-height:1.05;letter-spacing:-.02em}
h2{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;margin-bottom:.4em}
section{padding:clamp(48px,5vw,80px) 0;border-top:1px solid var(--line)}
.lead{max-width:62ch;color:var(--mute);font-size:1.15rem}
/* loader */
#load{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-content:center;gap:10px;text-align:center;transition:opacity .6s,visibility .6s}
#load b{font:800 clamp(4rem,16vw,9rem)/1 var(--hd);color:var(--cu);font-variant-numeric:tabular-nums}
#load span{color:var(--mute);font-size:.95rem}
#load.done{opacity:0;visibility:hidden}
/* nav */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{width:100%;max-width:none;padding-inline:clamp(20px,4vw,64px)}
nav{display:flex;align-items:center;gap:22px;height:56px}
nav .logo{font:800 1.15rem var(--hd);text-decoration:none;margin-right:auto}
nav a.l{font-size:.92rem;color:var(--mute);text-decoration:none}
nav a.l:hover{color:var(--ink)}
button{font:inherit;cursor:pointer}
.tg{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:4px 10px;font-size:.85rem}
@media(max-width:720px){nav a.l{display:none}}
/* hero */
.hero{position:relative;min-height:calc(100svh - 56px);display:flex;align-items:center;border-top:0;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tr{fill:none;stroke:var(--cu);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.55;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.8s .9s cubic-bezier(.6,.1,.2,1) forwards}
.tr.b{opacity:.25;animation-delay:1.3s}
.pad{fill:var(--bg);stroke:var(--cu);stroke-width:2;opacity:0;animation:pop .4s 3s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:.9}}
.hero .wrap{position:relative}
.hero h1{font-size:clamp(2rem,5.2vw,5.56rem);font-weight:800;line-height:.96}
.hero h1 .nm{display:block;white-space:nowrap;transition:color .35s}
.hero h1 .nm.a{color:var(--ink)}.hero h1 .nm.b{color:var(--cu)}
.hero h1 .nm span{display:inline-block}
.role{margin:22px 0 26px;font:500 clamp(1.2rem,2.6vw,1.65rem) var(--hd)}
.sub{color:var(--mute);max-width:52ch;margin:0 0 32px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;border:1px solid var(--cu);text-decoration:none;font-weight:500}
.btn.p{background:var(--cu);color:var(--bg)}.btn:hover{filter:brightness(1.12)}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:30px;color:var(--mute);font-size:1rem}
.hero .wrap{width:100%;max-width:1240px;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,385px);column-gap:clamp(40px,6vw,88px);align-items:center}
.hero .wrap>*{grid-column:1}
.pfp{margin:0;perspective:900px}
.pfp img{display:block;width:100%;height:auto;border-radius:20px;border:1px solid color-mix(in srgb,var(--cu) 45%,var(--line));transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out;filter:drop-shadow(0 0 24px color-mix(in srgb,var(--cu) 32%,transparent))}
@media(max-width:820px){.hero .wrap{grid-template-columns:1fr}.pfp{grid-column:1!important;grid-row:auto;max-width:305px;margin-bottom:28px}}
.gh{margin:18px 0 0}
.ph{display:block;font:500 1.3rem var(--hd);margin:-14px 0 28px;text-decoration:none;color:var(--mute)}
.ph:hover{color:var(--cu)}
.pfp{grid-column:2!important;grid-row:1/span 6;transform:translateY(-50px)}
@media(max-width:820px){.pfp{grid-column:1!important;grid-row:auto;transform:translateY(-12px)}}
.hero h1{width:fit-content;cursor:default}
.hero h1:hover .nm.a{color:var(--cu)}.hero h1:hover .nm.b{color:var(--ink)}
.hero h1:hover .nm span{animation:shk .42s ease-in-out infinite;animation-delay:calc(var(--i,0)*-53ms)}
@keyframes shk{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-3px,2px) rotate(-6deg)}40%{transform:translate(3px,-3px) rotate(5deg)}60%{transform:translate(-2px,-2px) rotate(-4deg)}80%{transform:translate(3px,2px) rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.hero h1:hover .nm span{animation:none}}
@keyframes shake{0%,100%{transform:translate(0)}10%{transform:translate(-6px,2px) rotate(-1.2deg)}20%{transform:translate(5px,-3px) rotate(1deg)}30%{transform:translate(-5px,3px) rotate(-1deg)}40%{transform:translate(6px,-2px) rotate(1.2deg)}50%{transform:translate(-4px,2px)}60%{transform:translate(4px,-2px) rotate(.8deg)}70%{transform:translate(-3px,1px)}80%{transform:translate(3px,-1px)}90%{transform:translate(-1px,0)}}
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(520px circle at var(--gx,50%) var(--gy,50%),color-mix(in srgb,var(--cu) 22%,transparent),transparent 70%)}
#glow.on{opacity:1}
.sk div{transition:background .2s}.sk div:hover{background:var(--bg2)}
.btn[hidden]{display:none}
.btns.ic{margin-top:28px;gap:14px}
.ib{display:inline-grid;place-items:center;width:54px;height:54px;padding:0;border-radius:50%}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{transform:translateY(-3px)}
@media (hover:hover) and (pointer:fine){html.cc,html.cc *{cursor:none!important}}
#cd,#cr{position:fixed;left:0;top:0;pointer-events:none;z-index:200;opacity:0;transition:opacity .25s}
#cd{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--ink)}
#cr{width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--ink) 65%,transparent);transition:opacity .25s,width .2s,height .2s,margin .2s,background .2s,border-color .2s}
#cr.h{width:64px;height:64px;margin:-32px 0 0 -32px;background:color-mix(in srgb,var(--cu) 16%,transparent);border-color:var(--cu)}
#cr.dn{width:30px;height:30px;margin:-15px 0 0 -15px}
html.cc.on #cd,html.cc.on #cr{opacity:1}
#resume h2{font-size:clamp(3rem,11vw,7.5rem);line-height:.95}
#resume h2 em{color:var(--cu);font-style:italic}
.rc{margin-top:36px;background:var(--bg2);border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,48px);transition:background .3s}
.rn{font-size:clamp(1.8rem,4vw,2.8rem)}
.rr{color:var(--cu);font-weight:500;margin:6px 0 10px}
.ri{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--mute);font-size:.95rem;margin:0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);border-top:1px solid var(--line);padding:10px 0;margin:26px 0}
.tabs button{background:none;border:0;color:var(--mute);padding:10px 18px;border-radius:999px;font-weight:500}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pane{display:none}.pane.on{display:block}
.pane h4{display:none;font:800 1.15rem var(--hd);border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 12px}
.pane h5{font:800 1rem var(--hd);color:var(--cu);margin:20px 0 6px}
.pane p{margin:.5em 0;max-width:70ch}
.jb b{font-family:var(--hd)}.jb span{color:var(--mute)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 18px;margin:0}
.kv dt{color:var(--cu);font-weight:500}.kv dd{margin:0;color:var(--mute)}
.pn{margin:0 0 20px}.pn h3{font-size:1.25rem}.pn .btn{padding:8px 16px;font-size:.92rem}
.rc .edu{margin-top:8px}
.rc.paper{--ink:#1c1b18;--mute:#4d4a42;--line:#d9d1bd;--cu:#0b7a3a;background:#fbf7ee;color:#1c1b18;font-family:Georgia,'Noto Sans Tamil',serif;border-radius:4px;border-color:#e6dfcf;max-width:820px;margin-inline:auto;transform:rotate(-.5deg);box-shadow:0 30px 60px rgba(0,0,0,.35);animation:unfold .5s ease-out}
.rc.paper .tabs{display:none}
.rc.paper .pane{display:block;margin-top:24px}.rc.paper .pane h4{display:block}
@keyframes unfold{from{transform:perspective(900px) rotateX(-14deg) scale(.96);opacity:.5}}
@media(max-width:720px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}}
/* skills */
.sk{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0;border:1px solid var(--line);margin-top:36px}
.sk div{padding:22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 -1px -1px 0}
.sk h3{font-size:1.1rem;color:var(--cu);margin-bottom:8px}
.sk p{margin:0;color:var(--mute);font-size:.98rem}
/* experience & timeline */
.job{display:grid;grid-template-columns:200px 1fr;gap:28px;margin-top:32px}
.job time{color:var(--cu);font:500 1rem var(--hd)}
.job h3{font-size:1.6rem;margin-bottom:2px}
.job .co{color:var(--mute);margin-bottom:14px}
ul.c{margin:0;padding-left:1.1em;max-width:68ch}ul.c li{margin:.45em 0}
ul.c li::marker{color:var(--cu)}
@media(max-width:720px){.job{grid-template-columns:1fr;gap:8px}}
/* projects */
.pj{margin-top:28px;border:1px solid var(--line);border-radius:14px;background:var(--bg2)}
.pj summary{list-style:none;cursor:pointer;padding:24px 26px;display:flex;gap:16px;align-items:center;justify-content:space-between}
.pj summary::-webkit-details-marker{display:none}
.pj summary::after{content:"+";font:500 1.8rem var(--hd);color:var(--cu);transition:transform .25s}
.pj[open] summary::after{transform:rotate(45deg)}
.pj h3{font-size:1.5rem}
.pj .stk{color:var(--mute);font-size:.92rem;margin-top:4px}
.pj .in{padding:0 26px 24px}
/* education */
.edu{margin-top:32px;border-left:2px solid var(--line);padding-left:28px}
.ed{position:relative;padding-bottom:30px}
.ed::before{content:"";position:absolute;left:-36px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--cu)}
.ed time{color:var(--cu);font:500 .95rem var(--hd)}
.ed h3{font-size:1.25rem;margin:2px 0}
.ed p{margin:0;color:var(--mute)}
/* lists */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:36px;margin-top:28px}
.cols h3{font-size:1.3rem;margin-bottom:10px}
.cols li{margin:.5em 0}
.mail{display:block;font:800 clamp(1.6rem,6vw,3.6rem)/1.1 var(--hd);letter-spacing:-.02em;text-decoration:none;margin:20px 0 28px;word-break:break-all}
.mail:hover{color:var(--cu)}
footer{padding:28px 0;border-top:1px solid var(--line);color:var(--mute);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}html{scroll-behavior:auto}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {
  useState,
  useEffect,
  useRef,
  useContext,
  createContext
} = React;
const D = {
  'Gopinath S.': 'கோபிநாத் செ.',
  'About': 'அறிமுகம்',
  'Skills': 'திறன்கள்',
  'Experience': 'அனுபவம்',
  'Projects': 'திட்டங்கள்',
  'Education': 'கல்வி',
  'Contact': 'தொடர்பு',
  'Theme': 'தீம்',
  'Gopinath': 'கோபிநாத்',
  '   Senthilkumar': '   செந்தில்குமார்',
  'JAVA DEVELOPER': 'ஜாவா டெவலப்பர்',
  'Electronics and Communication Engineering graduate who builds Spring Boot APIs and has taught programming to 900+ students.': 'மின்னணு மற்றும் தகவல்தொடர்புப் பொறியியல் பட்டதாரி. Spring Boot API-களை உருவாக்குகிறேன்; 900+ மாணவர்களுக்கு நிரலாக்கம் கற்பித்துள்ளேன்.',
  'Explore works': 'என் திட்டங்களைப் பார்க்க',
  'Get in touch': 'தொடர்பு கொள்ள',
  'Erode, Tamil Nadu, India': 'ஈரோடு, தமிழ்நாடு, இந்தியா',
  'From circuits to code.': 'சர்க்யூட்டிலிருந்து கோடிங் வரை.',
  'I studied Electronics and Communication Engineering, then moved into software. I work in Java, Spring Boot, REST APIs, MySQL, MongoDB and Google Cloud Platform, with a strong base in problem-solving, debugging, application testing and technical troubleshooting.': 'நான் மின்னணு மற்றும் தகவல்தொடர்புப் பொறியியல் படித்து, பின்னர் மென்பொருள் துறைக்கு வந்தேன். Java, Spring Boot, REST API, MySQL, MongoDB, Google Cloud Platform ஆகியவற்றில் பணியாற்றுகிறேன்; சிக்கல் தீர்த்தல், பிழைதிருத்தம், செயலி சோதனை, தொழில்நுட்பச் சிக்கல் தீர்வு ஆகியவற்றில் வலுவான அடித்தளம் உள்ளது.',
  'As a trainer I have taught Java, C and Python to 900+ students. I now want to bring that mix of support, testing and backend skills to application support and enterprise IT operations.': 'பயிற்றுநராக 900+ மாணவர்களுக்கு Java, C, Python கற்பித்துள்ளேன். ஆதரவு, சோதனை, பின்புலத் திறன்களின் இந்தக் கலவையை செயலி ஆதரவு மற்றும் நிறுவன IT செயல்பாடுகளில் பயன்படுத்த விரும்புகிறேன்.',
  'Programming': 'நிரலாக்கம்',
  'Frontend': 'முன்பக்கம்',
  'Backend': 'பின்புலம்',
  'Databases': 'தரவுத்தளங்கள்',
  'Cloud': 'கிளவுட்',
  'Cloud & DevOps': 'கிளவுட் & DevOps',
  'Core': 'அடிப்படை',
  'Tools': 'கருவிகள்',
  'Languages': 'மொழிகள்',
  'Spring Boot, REST APIs, CRUD operations, object-oriented programming, exception handling': 'Spring Boot, REST API-கள், CRUD செயல்பாடுகள், பொருள்நோக்கு நிரலாக்கம், விதிவிலக்கு கையாளுதல்',
  'Problem-solving, data structures and algorithms': 'சிக்கல் தீர்த்தல், தரவு கட்டமைப்புகள் மற்றும் அல்காரிதம்கள்',
  'Tamil and English: read, write, speak': 'தமிழ் மற்றும் ஆங்கிலம்: படிக்க, எழுத, பேச',
  'Apr 2025 – Sep 2026': 'ஏப். 2025 – செப். 2026',
  'Technical Trainer & Java Backend Developer': 'தொழில்நுட்பப் பயிற்றுநர் & ஜாவா பின்புல டெவலப்பர்',
  'Delivered hands-on Java, C and Python training to 900+ students.': '900+ மாணவர்களுக்கு Java, C, Python நேரடிப் பயிற்சி அளித்தேன்.',
  'Ran programming exercises on logic building, debugging and problem-solving.': 'தர்க்கம் உருவாக்கல், பிழைதிருத்தம், சிக்கல் தீர்த்தல் குறித்த நிரலாக்கப் பயிற்சிகளை நடத்தினேன்.',
  'Performed manual and functional testing to find, document and report software defects.': 'மென்பொருள் குறைபாடுகளைக் கண்டறிந்து, ஆவணப்படுத்தி, தெரிவிக்க கைமுறை மற்றும் செயல்பாட்டுச் சோதனைகள் செய்தேன்.',
  'Investigated application issues and shared findings to support quality assurance.': 'செயலிச் சிக்கல்களை ஆராய்ந்து, தர உறுதிக்கு உதவ கண்டறிதல்களைப் பகிர்ந்தேன்.',
